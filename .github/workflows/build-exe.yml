name: build-exe

# Builds a standalone u64deck.exe on a Windows runner.
# - Every push to main / manual run: exe available as a workflow artifact.
# - Push a tag like v1.0: exe attached to a GitHub Release.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write   # needed to attach the exe to releases
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller pefile

      - name: Run tests
        run: pytest -q

      - name: Verify README screenshot gallery
        if: startsWith(github.ref, 'refs/tags/')
        run: python gallery_check.py

      - name: Build
        run: pyinstaller u64deck.spec

      - name: Verify embedded executable icon
        shell: pwsh
        run: |
          @'
          import pefile
          pe = pefile.PE("dist/u64deck.exe")
          types = set()
          root = getattr(pe, "DIRECTORY_ENTRY_RESOURCE", None)
          if root:
              for entry in root.entries:
                  if entry.id is not None:
                      types.add(entry.id)
          assert 3 in types, "RT_ICON resource is missing"
          assert 14 in types, "RT_GROUP_ICON resource is missing"
          print("embedded icon resources OK")
          '@ | python -

      - name: Smoke test normal Edge app exit
        shell: pwsh
        run: |
          $profileNeedle = "u64deck\EdgeProfile"
          $p = Start-Process -FilePath "dist/u64deck.exe" -ArgumentList "--u64","203.0.113.9" -PassThru
          $ready = $false
          $edgeStarted = $false
          $deadline = (Get-Date).AddSeconds(35)
          try {
            do {
              Start-Sleep -Milliseconds 500
              $p.Refresh()
              if ($p.HasExited) {
                throw "u64deck.exe exited before the UI became ready (exit code $($p.ExitCode))"
              }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8064/" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ready = $true }
              } catch {
                # Server may still be starting; retry until the deadline.
              }
              $edgeStarted = [bool](Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
                Where-Object { $_.CommandLine -and $_.CommandLine.Contains($profileNeedle) })
            } while ((-not $ready -or -not $edgeStarted) -and (Get-Date) -lt $deadline)

            if (-not $ready) { throw "UI did not serve within 35 seconds" }
            if (-not $edgeStarted) { throw "dedicated Edge app process was not observed" }

            $exit = Invoke-WebRequest -Uri "http://127.0.0.1:8064/api/app/exit" `
              -Method Post -Headers @{"X-U64deck-Local-Exit"="1"} `
              -UseBasicParsing -TimeoutSec 5
            if ($exit.StatusCode -ne 200) { throw "Exit endpoint returned $($exit.StatusCode)" }

            $exitDeadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $p.Refresh()
              $edgeRemaining = [bool](Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
                Where-Object { $_.CommandLine -and $_.CommandLine.Contains($profileNeedle) })
            } while ((-not $p.HasExited -or $edgeRemaining) -and (Get-Date) -lt $exitDeadline)

            if (-not $p.HasExited) { throw "u64deck.exe and its console remained after Exit u64deck" }
            if ($edgeRemaining) { throw "dedicated Edge app process remained after Exit u64deck" }
            if ($p.ExitCode -ne 0) { throw "u64deck.exe exited with code $($p.ExitCode)" }
            Write-Host "normal Edge app, graceful cleanup, EXE exit and console retirement OK"
          } finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
              Where-Object { $_.CommandLine -and $_.CommandLine.Contains($profileNeedle) } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: u64deck-windows
          path: dist/u64deck.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/u64deck.exe
          fail_on_unmatched_files: true
