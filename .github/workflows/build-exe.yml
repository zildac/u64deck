name: build-exe

# Builds a standalone u64deck.exe on a Windows runner.
# - Every push to main / manual run: exe available as a workflow artifact.
# - Push a tag like v1.0: exe attached to a GitHub Release.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write   # needed to attach the exe to releases
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller pefile

      - name: Run tests
        run: pytest -q

      - name: Verify README screenshot gallery
        if: startsWith(github.ref, 'refs/tags/')
        run: python gallery_check.py

      - name: Record expected release identity
        shell: pwsh
        run: |
          $identity = python -c "from pathlib import Path; from release import VERSION, RELEASE_LABEL, source_build_id; print(VERSION + '|' + RELEASE_LABEL + '|' + source_build_id(Path('.'), Path('.')))"
          $parts = $identity.Trim().Split('|')
          if ($parts.Count -ne 3) { throw "Could not determine expected release identity: $identity" }
          "U64DECK_EXPECTED_VERSION=$($parts[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "U64DECK_EXPECTED_RELEASE=$($parts[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "U64DECK_EXPECTED_BUILD=$($parts[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ([string]::IsNullOrEmpty($parts[1])) {
            Write-Host "Expected identity: v$($parts[0]) · build $($parts[2])"
          } else {
            Write-Host "Expected identity: v$($parts[0]) · $($parts[1]) · build $($parts[2])"
          }

      - name: Verify icon source frames
        shell: pwsh
        run: |
          @'
          import struct
          from pathlib import Path
          data = Path("u64deck.ico").read_bytes()
          reserved, kind, count = struct.unpack_from("<HHH", data, 0)
          assert (reserved, kind) == (0, 1)
          sizes = []
          offset = 6
          for _ in range(count):
              width, height = struct.unpack_from("<BB", data, offset)
              width = 256 if width == 0 else width
              height = 256 if height == 0 else height
              assert width == height
              sizes.append(width)
              offset += 16
          assert sizes == [16, 24, 32, 48, 64, 128, 256], sizes
          print("ICO source frames OK:", sizes)
          '@ | python -

      - name: Build
        run: pyinstaller u64deck.spec

      - name: Verify packaging build stamp
        shell: pwsh
        run: |
          $stamp = (Get-Content "build/u64deck-build-id.txt" -Raw).Trim()
          if ($stamp -ne $env:U64DECK_EXPECTED_BUILD) {
            throw "Packaging stamp '$stamp' does not match expected build '$env:U64DECK_EXPECTED_BUILD'"
          }
          Write-Host "packaging build stamp OK: $stamp"

      - name: Verify embedded executable icon
        shell: pwsh
        run: |
          @'
          import pefile
          pe = pefile.PE("dist/u64deck.exe")
          types = set()
          root = getattr(pe, "DIRECTORY_ENTRY_RESOURCE", None)
          if root:
              for entry in root.entries:
                  if entry.id is not None:
                      types.add(entry.id)
          assert 3 in types, "RT_ICON resource is missing"
          assert 14 in types, "RT_GROUP_ICON resource is missing"
          print("embedded icon resources OK")
          '@ | python -

      - name: Verify PE VERSIONINFO
        shell: pwsh
        run: |
          @'
          import pefile
          pe = pefile.PE("dist/u64deck.exe")
          strings = {}
          for group in getattr(pe, "FileInfo", []) or []:
              entries = group if isinstance(group, list) else [group]
              for entry in entries:
                  if getattr(entry, "Key", b"") == b"StringFileInfo":
                      for table in entry.StringTable:
                          for key, value in table.entries.items():
                              k = key.decode("utf-8", "replace") if isinstance(key, bytes) else str(key)
                              v = value.decode("utf-8", "replace") if isinstance(value, bytes) else str(value)
                              strings[k] = v
          expected = {
              "FileVersion": f"{__import__('os').environ['U64DECK_EXPECTED_VERSION']}.0",
              "ProductVersion": f"{__import__('os').environ['U64DECK_EXPECTED_VERSION']}.0",
              "ReleaseLabel": __import__('os').environ['U64DECK_EXPECTED_RELEASE'],
              "BuildId": __import__('os').environ['U64DECK_EXPECTED_BUILD'],
              "OriginalFilename": "u64deck.exe",
          }
          for key, value in expected.items():
              assert strings.get(key) == value, (key, strings.get(key), value)
          print("PE VERSIONINFO OK:", expected)
          '@ | python -

      - name: Smoke test normal Edge app exit and frozen identity
        shell: pwsh
        run: |
          $profileNeedle = "u64deck\EdgeProfile"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "u64deck-stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "u64deck-stderr.log"
          Remove-Item $stdoutPath,$stderrPath -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist/u64deck.exe" -ArgumentList "--u64","203.0.113.9" `
            -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath -PassThru
          $ready = $false
          $edgeStarted = $false
          $deadline = (Get-Date).AddSeconds(35)
          try {
            do {
              Start-Sleep -Milliseconds 500
              $p.Refresh()
              if ($p.HasExited) {
                $stderr = if (Test-Path $stderrPath) { Get-Content $stderrPath -Raw } else { "" }
                throw "u64deck.exe exited before the UI became ready (exit code $($p.ExitCode)): $stderr"
              }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8064/" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ready = $true }
              } catch {
                # Server may still be starting; retry until the deadline.
              }
              $edgeStarted = [bool](Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
                Where-Object { $_.CommandLine -and $_.CommandLine.Contains($profileNeedle) })
            } while ((-not $ready -or -not $edgeStarted) -and (Get-Date) -lt $deadline)

            if (-not $ready) { throw "UI did not serve within 35 seconds" }
            if (-not $edgeStarted) { throw "dedicated Edge app process was not observed" }

            $identity = Invoke-RestMethod -Uri "http://127.0.0.1:8064/api/app_config" -TimeoutSec 5
            if ($identity.version -ne $env:U64DECK_EXPECTED_VERSION) {
              throw "EXE API version '$($identity.version)' does not match '$env:U64DECK_EXPECTED_VERSION'"
            }
            if ($identity.release_label -ne $env:U64DECK_EXPECTED_RELEASE) {
              throw "EXE API release '$($identity.release_label)' does not match '$env:U64DECK_EXPECTED_RELEASE'"
            }
            if ($identity.build -ne $env:U64DECK_EXPECTED_BUILD) {
              throw "EXE API build '$($identity.build)' does not match documented source build '$env:U64DECK_EXPECTED_BUILD'"
            }
            if ([string]::IsNullOrEmpty($identity.release_label)) {
              Write-Host "frozen API identity OK: v$($identity.version) · build $($identity.build)"
            } else {
              Write-Host "frozen API identity OK: v$($identity.version) · $($identity.release_label) · build $($identity.build)"
            }

            $rejected = Invoke-WebRequest -Uri "http://127.0.0.1:8064/api/app/exit" `
              -Method Post -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
            if ($rejected.StatusCode -ne 403) {
              throw "Unconfirmed Exit request returned $($rejected.StatusCode), expected 403"
            }
            Write-Host "unconfirmed local Exit rejection OK: HTTP 403"

            $exit = Invoke-WebRequest -Uri "http://127.0.0.1:8064/api/app/exit" `
              -Method Post -Headers @{"X-U64deck-Local-Exit"="1"} `
              -UseBasicParsing -TimeoutSec 5
            if ($exit.StatusCode -ne 200) { throw "Exit endpoint returned $($exit.StatusCode)" }

            $exitDeadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $p.Refresh()
              $edgeRemaining = [bool](Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
                Where-Object { $_.CommandLine -and $_.CommandLine.Contains($profileNeedle) })
            } while ((-not $p.HasExited -or $edgeRemaining) -and (Get-Date) -lt $exitDeadline)

            if (-not $p.HasExited) { throw "u64deck.exe and its console remained after Exit u64deck" }
            if ($edgeRemaining) { throw "dedicated Edge app process remained after Exit u64deck" }
            if ($p.ExitCode -ne 0) { throw "u64deck.exe exited with code $($p.ExitCode)" }

            $stdout = if (Test-Path $stdoutPath) { Get-Content $stdoutPath -Raw } else { "" }
            # Redirected Windows console output can replace the decorative U+00B7
            # separators when the runner's capture encoding differs. Assert the
            # identity-bearing fields independently so encoding cannot weaken or
            # falsely fail the version/release/build guarantee.
            $expectedBannerVersion = "u64deck v$env:U64DECK_EXPECTED_VERSION"
            $expectedBannerBuild = "build $env:U64DECK_EXPECTED_BUILD"
            if (-not $stdout.Contains($expectedBannerVersion) -or
                -not $stdout.Contains($expectedBannerBuild)) {
              throw "EXE startup banner did not report the documented version and build. Output: $stdout"
            }
            if ([string]::IsNullOrEmpty($env:U64DECK_EXPECTED_RELEASE)) {
              if ($stdout.Contains("Release Candidate")) {
                throw "Final EXE startup banner still contains release-candidate wording. Output: $stdout"
              }
              Write-Host "frozen Final banner identity OK: $expectedBannerVersion / $expectedBannerBuild"
            } else {
              if (-not $stdout.Contains($env:U64DECK_EXPECTED_RELEASE)) {
                throw "EXE startup banner did not report release '$env:U64DECK_EXPECTED_RELEASE'. Output: $stdout"
              }
              Write-Host "frozen banner identity OK: $expectedBannerVersion / $env:U64DECK_EXPECTED_RELEASE / $expectedBannerBuild"
            }
            Write-Host "normal Edge app, graceful cleanup, EXE exit and console retirement OK"
          } finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
              Where-Object { $_.CommandLine -and $_.CommandLine.Contains($profileNeedle) } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

      - name: Stage Windows release package
        shell: pwsh
        run: |
          $packageRoot = "dist/u64deck-windows"
          Remove-Item $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$packageRoot/library" -Force | Out-Null
          Copy-Item "dist/u64deck.exe" "$packageRoot/u64deck.exe"
          Copy-Item "library/README.txt" "$packageRoot/library/README.txt"
          Compress-Archive -Path "$packageRoot/*" -DestinationPath "dist/u64deck-v1.9.0-windows.zip" -Force

      - name: Verify packaged library
        shell: pwsh
        run: |
          @'
          import zipfile
          from pathlib import Path
          archive = Path("dist/u64deck-v1.9.0-windows.zip")
          canonical = (
              "Drop .crt/.prg/.t64/.sid/.mod/.d64/.d71/.d81/.g64/.dnp files here.\n"
              "Each appears as a Quick Launch button in u64deck's SCREEN tab.\n"
          ).encode("utf-8")
          with zipfile.ZipFile(archive) as zf:
              files = sorted(name.replace("\\", "/") for name in zf.namelist() if not name.endswith("/"))
              assert files == ["library/README.txt", "u64deck.exe"], files
              assert zf.read("library/README.txt") == canonical
          print("Windows package and canonical library README OK")
          '@ | python -

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: u64deck-windows
          path: |
            dist/u64deck.exe
            dist/u64deck-v1.9.0-windows.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/u64deck.exe
            dist/u64deck-v1.9.0-windows.zip
          fail_on_unmatched_files: true
