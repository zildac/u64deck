name: build-exe

# Builds a standalone u64deck.exe on a Windows runner.
# - Every push to main / manual run: exe available as a workflow artifact.
# - Push a tag like v1.0: exe attached to a GitHub Release.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write   # needed to attach the exe to releases
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller pefile

      - name: Run tests
        run: pytest -q

      - name: Verify README screenshot gallery
        if: startsWith(github.ref, 'refs/tags/')
        run: python gallery_check.py

      - name: Record expected release identity
        shell: pwsh
        run: |
          $identity = python -c "from pathlib import Path; from release import VERSION, RELEASE_LABEL, source_build_id; print(VERSION + '|' + RELEASE_LABEL + '|' + source_build_id(Path('.'), Path('.')))"
          $parts = $identity.Trim().Split('|')
          if ($parts.Count -ne 3) { throw "Could not determine expected release identity: $identity" }
          "U64DECK_EXPECTED_VERSION=$($parts[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "U64DECK_EXPECTED_RELEASE=$($parts[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "U64DECK_EXPECTED_BUILD=$($parts[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Expected identity: v$($parts[0]) · $($parts[1]) · $($parts[2])"

      - name: Build
        run: pyinstaller u64deck.spec

      - name: Verify packaging build stamp
        shell: pwsh
        run: |
          $stamp = (Get-Content "build/u64deck-build-id.txt" -Raw).Trim()
          if ($stamp -ne $env:U64DECK_EXPECTED_BUILD) {
            throw "Packaging stamp '$stamp' does not match expected build '$env:U64DECK_EXPECTED_BUILD'"
          }
          Write-Host "packaging build stamp OK: $stamp"

      - name: Verify embedded executable icon
        shell: pwsh
        run: |
          @'
          import pefile
          pe = pefile.PE("dist/u64deck.exe")
          types = set()
          root = getattr(pe, "DIRECTORY_ENTRY_RESOURCE", None)
          if root:
              for entry in root.entries:
                  if entry.id is not None:
                      types.add(entry.id)
          assert 3 in types, "RT_ICON resource is missing"
          assert 14 in types, "RT_GROUP_ICON resource is missing"
          print("embedded icon resources OK")
          '@ | python -

      - name: Smoke test normal Edge app exit and frozen identity
        shell: pwsh
        run: |
          $profileNeedle = "u64deck\EdgeProfile"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "u64deck-stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "u64deck-stderr.log"
          Remove-Item $stdoutPath,$stderrPath -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist/u64deck.exe" -ArgumentList "--u64","203.0.113.9" `
            -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath -PassThru
          $ready = $false
          $edgeStarted = $false
          $deadline = (Get-Date).AddSeconds(35)
          try {
            do {
              Start-Sleep -Milliseconds 500
              $p.Refresh()
              if ($p.HasExited) {
                $stderr = if (Test-Path $stderrPath) { Get-Content $stderrPath -Raw } else { "" }
                throw "u64deck.exe exited before the UI became ready (exit code $($p.ExitCode)): $stderr"
              }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8064/" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ready = $true }
              } catch {
                # Server may still be starting; retry until the deadline.
              }
              $edgeStarted = [bool](Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
                Where-Object { $_.CommandLine -and $_.CommandLine.Contains($profileNeedle) })
            } while ((-not $ready -or -not $edgeStarted) -and (Get-Date) -lt $deadline)

            if (-not $ready) { throw "UI did not serve within 35 seconds" }
            if (-not $edgeStarted) { throw "dedicated Edge app process was not observed" }

            $identity = Invoke-RestMethod -Uri "http://127.0.0.1:8064/api/app_config" -TimeoutSec 5
            if ($identity.version -ne $env:U64DECK_EXPECTED_VERSION) {
              throw "EXE API version '$($identity.version)' does not match '$env:U64DECK_EXPECTED_VERSION'"
            }
            if ($identity.release_label -ne $env:U64DECK_EXPECTED_RELEASE) {
              throw "EXE API release '$($identity.release_label)' does not match '$env:U64DECK_EXPECTED_RELEASE'"
            }
            if ($identity.build -ne $env:U64DECK_EXPECTED_BUILD) {
              throw "EXE API build '$($identity.build)' does not match documented source build '$env:U64DECK_EXPECTED_BUILD'"
            }
            Write-Host "frozen API identity OK: v$($identity.version) · $($identity.release_label) · $($identity.build)"

            $rejected = Invoke-WebRequest -Uri "http://127.0.0.1:8064/api/app/exit" `
              -Method Post -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
            if ($rejected.StatusCode -ne 403) {
              throw "Unconfirmed Exit request returned $($rejected.StatusCode), expected 403"
            }
            Write-Host "unconfirmed local Exit rejection OK: HTTP 403"

            $exit = Invoke-WebRequest -Uri "http://127.0.0.1:8064/api/app/exit" `
              -Method Post -Headers @{"X-U64deck-Local-Exit"="1"} `
              -UseBasicParsing -TimeoutSec 5
            if ($exit.StatusCode -ne 200) { throw "Exit endpoint returned $($exit.StatusCode)" }

            $exitDeadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $p.Refresh()
              $edgeRemaining = [bool](Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
                Where-Object { $_.CommandLine -and $_.CommandLine.Contains($profileNeedle) })
            } while ((-not $p.HasExited -or $edgeRemaining) -and (Get-Date) -lt $exitDeadline)

            if (-not $p.HasExited) { throw "u64deck.exe and its console remained after Exit u64deck" }
            if ($edgeRemaining) { throw "dedicated Edge app process remained after Exit u64deck" }
            if ($p.ExitCode -ne 0) { throw "u64deck.exe exited with code $($p.ExitCode)" }

            $stdout = if (Test-Path $stdoutPath) { Get-Content $stdoutPath -Raw } else { "" }
            $expectedBanner = "u64deck v$env:U64DECK_EXPECTED_VERSION · $env:U64DECK_EXPECTED_RELEASE · build $env:U64DECK_EXPECTED_BUILD"
            if (-not $stdout.Contains($expectedBanner)) {
              throw "EXE startup banner did not report the documented identity. Output: $stdout"
            }
            Write-Host "frozen banner identity OK: $expectedBanner"
            Write-Host "normal Edge app, graceful cleanup, EXE exit and console retirement OK"
          } finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" |
              Where-Object { $_.CommandLine -and $_.CommandLine.Contains($profileNeedle) } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: u64deck-windows
          path: dist/u64deck.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/u64deck.exe
          fail_on_unmatched_files: true
